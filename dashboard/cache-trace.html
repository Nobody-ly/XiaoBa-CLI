<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缓存命中监控</title>
<style>:root{color-scheme:dark;--bg:#07101f;--panel:#101c30;--line:#263750;--muted:#8ea0b9;--good:#47d7a3;--warn:#ffbd66}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#14294a,var(--bg) 42%);color:#edf5ff;font:14px system-ui,-apple-system,sans-serif}main{max-width:1380px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px}.head h1{margin:0;font-size:28px}.muted{color:var(--muted)}button,select{background:#172640;color:#eef6ff;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card,.panel{background:rgba(16,28,48,.92);border:1px solid var(--line);border-radius:14px;padding:16px}.value{font-size:25px;font-weight:720;margin-top:8px}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}.sessions{max-height:640px;overflow:auto}.session{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.session:hover,.session.active{background:#1a2b47}.session b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:6px;background:#293951;border-radius:9px;margin-top:8px}.bar i{display:block;height:100%;background:var(--good);border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);position:sticky;top:0;background:var(--panel)}.records{max-height:640px;overflow:auto}.reset{color:var(--warn)}.good{color:var(--good)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}</style></head>
<body><main><div class="head"><div><h1>缓存命中监控</h1><div class="muted" id="root">正在读取 trace…</div></div><button id="reload">刷新</button></div><section class="cards"><div class="card">文件<div class="value" id="files">—</div></div><div class="card">有效记录<div class="value" id="records">—</div></div><div class="card">会话<div class="value" id="sessionsCount">—</div></div><div class="card">坏文件<div class="value" id="bad">—</div></div><div class="card">当前会话命中率<div class="value" id="ratio">—</div></div></section><section class="layout"><div class="panel sessions" id="sessions"></div><div class="panel records"><table><thead><tr><th>时间 / 轮次</th><th>模型与 API</th><th>输入</th><th>读缓存</th><th>写缓存</th><th>命中率</th><th>前缀变化</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id), pct=n=>`${((n||0)*100).toFixed(1)}%`, num=n=>Number(n||0).toLocaleString(); let sessions=[];
async function json(url){const storageKey='catsco.dashboardApiKey';let key='';try{key=sessionStorage.getItem(storageKey)||''}catch{};const request=()=>fetch(url,{headers:key?{'X-API-Key':key}:{}});let r=await request();if(r.status===401||r.status===403){const entered=window.prompt('Dashboard API Key 无效或缺失，请输入')||'';key=entered.trim();if(key){try{sessionStorage.setItem(storageKey,key)}catch{};r=await request()}}if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()}
async function load(){try{const [status,list]=await Promise.all([json('/api/cache-trace/status'),json('/api/cache-trace/sessions')]);$('root').textContent=status.traceDir;$('files').textContent=num(status.scannedFiles);$('records').textContent=num(status.records);$('sessionsCount').textContent=num(status.sessions);$('bad').textContent=num(status.malformedFiles);sessions=list.sessions||[];renderSessions();if(sessions[0])await select(sessions[0].sessionId)}catch(e){$('root').textContent=`读取失败：${e.message}`}}
function renderSessions(){ $('sessions').innerHTML=sessions.map(s=>`<div class="session" data-id="${escapeHtml(s.sessionId)}"><b>${escapeHtml(s.sessionId)}</b><span class="muted">${s.records} 轮 · ${escapeHtml(s.models.join(', '))}</span><div class="bar"><i style="width:${Math.min(100,s.weightedHitRatio*100)}%"></i></div></div>`).join('');document.querySelectorAll('.session').forEach(el=>el.onclick=()=>select(el.dataset.id))}
async function select(id){document.querySelectorAll('.session').forEach(el=>el.classList.toggle('active',el.dataset.id===id));const data=await json('/api/cache-trace/session/'+encodeURIComponent(id));$('ratio').textContent=pct(data.session.weightedHitRatio);$('rows').innerHTML=data.records.slice().reverse().map(r=>`<tr><td>${new Date(r.timestamp).toLocaleString()}<br><span class="muted">T${r.episodeNumber}</span></td><td>${escapeHtml(r.provider)} / ${escapeHtml(r.model)}<br><span class="muted">${escapeHtml(r.apiType)}</span></td><td>${num(r.usage.inputTokens)}</td><td class="good">${num(r.usage.cacheReadTokens)}</td><td>${num(r.usage.cacheWriteTokens)}</td><td>${pct(r.usage.hitRatio)}</td><td class="${r.diff.baselineReset?'reset':''}">${r.diff.baselineReset?'基线重置':r.diff.stableSystemChanged?'稳定系统提示变化':r.diff.changedMessageIndices.length?`消息变化 ${r.diff.changedMessageIndices.join(',')}`:'稳定'}</td></tr>`).join('')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('reload').onclick=load;load();
</script></body></html>
