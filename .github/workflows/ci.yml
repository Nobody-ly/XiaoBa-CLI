name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build and runtime tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout XiaoBa-CLI
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Release branding check
        run: npm run release:check

      - name: Build
        run: npm run build

      - name: Runtime tests
        run: npm test

  cross-repo-catsco:
    name: CatsCo/XiaoBa BotDefinition Skills paired contract tests
    runs-on: ubuntu-latest
    needs: runtime
    timeout-minutes: 15

    steps:
      - name: Checkout XiaoBa-CLI
        uses: actions/checkout@v4
        with:
          path: XiaoBa-CLI

      - name: Require BotDefinition Skills paired contract script
        working-directory: XiaoBa-CLI
        run: |
          test -f scripts/cross-repo-catsco-skills-smoke.mjs

      - name: Checkout cats-company
        uses: actions/checkout@v4
        with:
          repository: buildsense-ai/cats-company
          ref: ${{ vars.CATSCOMPANY_SKILLS_REF || 'main' }}
          path: cats-company

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: XiaoBa-CLI/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum

      - name: Install XiaoBa dependencies
        working-directory: XiaoBa-CLI
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run BotDefinition Skills paired contract tests
        working-directory: XiaoBa-CLI
        env:
          CATSCOMPANY_REPO: ../cats-company
        run: npm run test:cross-repo:catsco-skills
