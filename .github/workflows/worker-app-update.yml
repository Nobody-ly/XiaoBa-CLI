name: Update Worker Application Artifacts

# Part A: on a stable tag (with the kill-switch repo var enabled) or a manual
# dispatch from main, build the deterministic worker application artifact and
# deploy it serially to the worker targets. Only /opt/catsco is touched on the
# workers; /srv/catsco-agent data is never modified.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      update_workers:
        description: Deploy the current main build to worker targets
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: worker-app-update
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.1"

jobs:
  build-and-deploy:
    name: Build artifact and deploy to workers
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_workers &&
       github.ref == 'refs/heads/main') ||
      (startsWith(github.ref, 'refs/tags/') &&
       vars.CTYUN_WORKER_APP_UPDATE == 'true')
    runs-on: ubuntu-24.04
    environment: release-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Build deterministic worker artifact
        run: |
          mkdir -p release/worker
          node scripts/build-linux-worker-artifact.mjs > release/worker/build-manifest.json
      - name: Deploy artifact to worker targets
        run: |
          ARTIFACT="$(jq -r .artifactPath release/worker/build-manifest.json)"
          SHA="$(jq -r .sha256 release/worker/build-manifest.json)"
          VERSION="$(jq -r .version release/worker/build-manifest.json)"
          COMMIT="$(jq -r .commit release/worker/build-manifest.json)"
          node scripts/deploy-worker-artifact.mjs \
            --artifact "$ARTIFACT" --sha256 "$SHA" \
            --version "$VERSION" --commit "$COMMIT"
        env:
          # SSH key injected via repo secret (name only — never hardcoded).
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
